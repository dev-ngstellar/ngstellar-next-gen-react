<!DOCTYPE html>
<html>
<head>
  <title>Color Extractor</title>
</head>
<body>
  <canvas id="canvas"></canvas>
  <pre id="result">Extracting...</pre>
  <script>
    const img = new Image();
    img.src = './logo_ngs.png';
    img.onload = () => {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      const colorCounts = {};
      
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i+1];
        const b = data[i+2];
        const a = data[i+3];
        
        // Skip transparent and near-white/near-black pixels
        if (a < 200) continue;
        if (r > 240 && g > 240 && b > 240) continue;
        if (r < 15 && g < 15 && b < 15) continue;
        
        // Group similar colors together by rounding to nearest 10 to get a smoother palette representation
        const roundR = Math.round(r / 5) * 5;
        const roundG = Math.round(g / 5) * 5;
        const roundB = Math.round(b / 5) * 5;
        
        const hex = "#" + ((1 << 24) + (roundR << 16) + (roundG << 8) + roundB).toString(16).slice(1);
        colorCounts[hex] = (colorCounts[hex] || 0) + 1;
      }
      
      const sortedColors = Object.keys(colorCounts).sort((a, b) => colorCounts[b] - colorCounts[a]);
      const resultDiv = document.getElementById('result');
      resultDiv.innerText = JSON.stringify({
        topColors: sortedColors.slice(0, 30),
        counts: sortedColors.slice(0, 10).map(c => ({ color: c, count: colorCounts[c] }))
      }, null, 2);
    };
    img.onerror = (e) => {
      document.getElementById('result').innerText = 'Error loading image: ' + e.message;
    };
  </script>
</body>
</html>
